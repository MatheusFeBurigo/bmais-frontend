<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Marca da BMais na aba do navegador: o mesmo "B+" da barra lateral e do login
       (.sb-brand-mark: gradiente #2E86E1 → #0F4D9E, cantos arredondados). -->
  <defs>
    <linearGradient id="bmais" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E86E1"/>
      <stop offset="1" stop-color="#0F4D9E"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#bmais)"/>
  <text x="16" y="21.4" text-anchor="middle" fill="#fff" font-size="15" font-weight="700" letter-spacing="-0.4"
        font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">B+</text>
</svg>
